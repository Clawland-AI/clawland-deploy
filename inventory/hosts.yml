# Ansible inventory for Clawland edge deployments
# Usage: ansible-playbook -i inventory/hosts.yml playbooks/deploy-picoclaw.yml

all:
  children:
    picoclaw_nodes:
      hosts:
        picoclaw-01:
          ansible_host: 192.168.1.100
          ansible_user: pi
          ansible_become: yes
          picoclaw_port: 8080
          moltclaw_url: "https://moltclaw.clawland.ai"
          # Optional: connect to local NanoClaw gateway
          # nanoclaw_enabled: true
          # nanoclaw_url: "http://192.168.1.50:8000"
        
        # picoclaw-02:
        #   ansible_host: 192.168.1.101
        #   ansible_user: pi
        #   ansible_become: yes
      
      vars:
        # Shared variables for all PicoClaw nodes
        picoclaw_version: "0.1.0"
        moltclaw_url: "https://moltclaw.clawland.ai"
    
    nanoclaw_nodes:
      hosts:
        # nanoclaw-01:
        #   ansible_host: 192.168.1.50
        #   ansible_user: pi
        #   ansible_become: yes
      
      vars:
        nanoclaw_version: "0.2.0"
    
    microclaw_nodes:
      hosts:
        # microclaw-01:
        #   ansible_host: 192.168.1.200
        #   ansible_user: root
        #   ansible_become: no
      
      vars:
        microclaw_version: "0.2.0"
