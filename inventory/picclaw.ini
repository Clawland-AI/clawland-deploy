# PicoClaw Node Inventory
# Define your target nodes here

[picclaw_nodes]
# Example: Single Raspberry Pi
# raspberrypi.local ansible_user=pi ansible_become_pass=raspberry

# Example: VPS
# 192.168.1.100 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

# Example: Multiple nodes
# node1.example.com
# node2.example.com
# node3.example.com

[picclaw_nodes:vars]
# Global variables for all picclaw nodes
ansible_python_interpreter=/usr/bin/python3
telegram_bot_token=YOUR_TELEGRAM_BOT_TOKEN_HERE
fleet_manager_url=https://fleet.clawland.ai
enable_firewall=true
